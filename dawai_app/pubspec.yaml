name: dawai_app
description: "Dawai - Your nearest pharmacy, wherever you are"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.13.3

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  supabase_flutter: ^2.9.1
  package_info_plus: ^9.0.1
  go_router: ^15.1.3
  provider: ^6.1.2
  google_fonts: ^6.2.1
  shared_preferences: ^2.5.5
  http: ^1.2.0
  # Location & Maps
  geolocator: ^14.0.0
  geocoding: ^4.0.0
  flutter_map: ^8.0.0
  latlong2: ^0.9.1
  # Sharing & Social
  share_plus: ^11.0.0
  url_launcher: ^6.3.1
  # Camera & Image
  image_picker: ^1.1.2
  # Voice Search
  speech_to_text: ^7.2.0
  # PDF & Printing
  pdf: ^3.11.2
  printing: ^5.13.4
  # Notifications
  flutter_local_notifications: ^18.0.1
  # UI
  cached_network_image: ^3.4.1
  shimmer: ^3.0.0
  intl: ^0.20.2
  badges: ^3.1.2
  photo_view: ^0.15.0
  connectivity_plus: ^6.1.3
  flutter_staggered_animations: ^1.1.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
