# The -Duser.* flags pin the Gradle JVM to en-US; see the note next to
# kotlin.daemon.jvmargs at the bottom for why a non-ASCII digit locale silently
# disables the Kotlin daemon. UTF-8 and preferIPv4Stack ride along for the same
# reason: they govern the daemon's run file name, its RMI handshake and its log
# timestamps, none of which survive a non-ASCII or IPv6-resolved environment.
#
# Beware: these settings are easy to defeat from outside the repo. A user-level
# gradle.properties (~/.gradle, or $GRADLE_USER_HOME) that declares
# org.gradle.jvmargs REPLACES this line instead of merging with it, so on such a
# machine the flags below silently do nothing and every build reports
#   e: Failed connecting to the daemon in 4 retries
# while still succeeding, because Kotlin quietly falls back to in-process
# compilation - it only ever shows up as a slow build. When that message shows
# up, check those two files before suspecting this one.
org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g -XX:+HeapDumpOnOutOfMemoryError -Duser.language=en -Duser.country=US -Duser.language.format=en -Duser.country.format=US -Dfile.encoding=UTF-8 -Dsun.jnu.encoding=UTF-8 -Djava.net.preferIPv4Stack=true
android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configureondemand=true

# Enabled parallel sync for Gradle 9.4+
org.gradle.tooling.parallel=true

# The Kotlin daemon client resolves "localhost" and the daemon itself listens on
# 127.0.0.1. Where the resolver hands back ::1 first, the client never reaches
# it, so the build logs "Failed connecting to the daemon in 4 retries" and then
# silently falls back to in-process compilation - the build still succeeds, just
# slower, which is exactly why this went unnoticed. Pinning the JVM to IPv4 is
# not machine-specific: it depends on the resolver's ordering, not on the host.
systemProp.java.net.preferIPv4Stack=true

# Under a locale such as ar-EG the JVM formats digits with Eastern-Arabic
# numerals (U+0660-U+0669), so it names the Kotlin daemon's .run file with those
# digits while the client looks for it with an ASCII pattern. Nothing matches, so
# the daemon never starts and every build pays the retry cost above before
# compiling in-process. Forcing en-US keeps the file name ASCII.
#
# The same flags appear on org.gradle.jvmargs above: the client JVM needs them
# too, not just the daemon. These are committed deliberately - they are not
# local-only, they affect anyone whose machine locale formats digits in a
# non-ASCII script, and the failure they prevent is silent.
kotlin.daemon.jvmargs=-Duser.language=en -Duser.country=US -Duser.language.format=en -Duser.country.format=US -Dfile.encoding=UTF-8 -Dsun.jnu.encoding=UTF-8 -Djava.net.preferIPv4Stack=true
