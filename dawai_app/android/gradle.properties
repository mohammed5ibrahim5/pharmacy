# The -Duser.* flags pin the Gradle JVM to en-US; see the note next to
# kotlin.daemon.jvmargs at the bottom for why a non-ASCII digit locale silently
# disables the Kotlin daemon.
org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g -XX:+HeapDumpOnOutOfMemoryError -Duser.language=en -Duser.country=US -Duser.language.format=en -Duser.country.format=US
android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configureondemand=true

# Enabled parallel sync for Gradle 9.4+
org.gradle.tooling.parallel=true

# The Kotlin daemon client resolves "localhost" and the daemon itself listens on
# 127.0.0.1. Where the resolver hands back ::1 first, the client never reaches
# it, so the build logs "Failed connecting to the daemon in 4 retries" and then
# silently falls back to in-process compilation - the build still succeeds, just
# slower, which is exactly why this went unnoticed. Pinning the JVM to IPv4 is
# not machine-specific: it depends on the resolver's ordering, not on the host.
systemProp.java.net.preferIPv4Stack=true

# Under a locale such as ar-EG the JVM formats digits with Eastern-Arabic
# numerals (U+0660-U+0669), so it names the Kotlin daemon's .run file with those
# digits while the client looks for it with an ASCII pattern. Nothing matches, so
# the daemon never starts and every build pays the retry cost above before
# compiling in-process. Forcing en-US keeps the file name ASCII.
#
# The same flags appear on org.gradle.jvmargs above: the client JVM needs them
# too, not just the daemon. These are committed deliberately - they are not
# local-only, they affect anyone whose machine locale formats digits in a
# non-ASCII script, and the failure they prevent is silent.
kotlin.daemon.jvmargs=-Duser.language=en -Duser.country=US -Duser.language.format=en -Duser.country.format=US
