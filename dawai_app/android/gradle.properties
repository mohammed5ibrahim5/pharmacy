org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g -XX:+HeapDumpOnOutOfMemoryError -Duser.language=en -Duser.country=US -Duser.language.format=en -Duser.country.format=US
android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configureondemand=true

# Enabled parallel sync for Gradle 9.4+
org.gradle.tooling.parallel=true

# LOCAL ONLY - do not commit: Kotlin daemon client cannot connect when
# localhost resolves to ::1 first while the daemon listens on 127.0.0.1.
systemProp.java.net.preferIPv4Stack=true

# LOCAL ONLY - do not commit: this machine's format locale is ar-EG, so the JVM
# named the Kotlin daemon .run file with Eastern-Arabic digits (U+0660-U+0669)
# and the client's ASCII filename pattern never matched it -> every build logged
# "Failed connecting to the daemon in 4 retries" and silently compiled in-process.
# Force en-US for the Gradle (client) JVM and the Kotlin daemon JVM.
kotlin.daemon.jvmargs=-Duser.language=en -Duser.country=US -Duser.language.format=en -Duser.country.format=US
