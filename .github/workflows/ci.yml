name: CI/CD Pipeline

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master]

jobs:
  flutter-build:
    name: Flutter - Build APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check environment
        run: |
          echo "Runner OS: $RUNNER_OS"
          echo "ANDROID_HOME: $ANDROID_HOME"
          echo "ANDROID_SDK_ROOT: $ANDROID_SDK_ROOT"
          java -version 2>&1 || echo "No Java"
          ls -la $ANDROID_HOME 2>/dev/null || echo "No ANDROID_HOME"
          pwd
          ls -la

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Check Java after setup
        run: java -version 2>&1

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: stable
          cache: true

      - name: Check Flutter
        run: flutter --version

      - name: Build
        working-directory: dawai_app
        run: |
          flutter pub get
          flutter build apk --release

      - uses: actions/upload-artifact@v4
        with:
          name: apk-release
          path: dawai_app/build/app/outputs/flutter-apk/app-release.apk

  web-build:
    name: Web - Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: echo "Web build skipped"
