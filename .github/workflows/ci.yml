name: CI/CD Pipeline

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master]

jobs:
  flutter-build:
    name: Flutter - Build APK
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dawai_app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Flutter
        run: |
          git clone https://github.com/flutter/flutter.git --depth 1 -b stable $HOME/flutter
          echo "$HOME/flutter/bin" >> $GITHUB_PATH
          export PATH="$HOME/flutter/bin:$PATH"
          flutter --version

      - name: Accept Android licenses
        run: yes | flutter doctor --android-licenses || true

      - run: flutter pub get
      - run: flutter analyze --no-pub || true

      # Release signing. build.gradle.kts hard-gates packageRelease on
      # android/key.properties (git-ignored, never committed), so the two files
      # are restored from repository secrets before the build. Secrets hold
      # base64 of the exact local files: key.properties stays byte-identical,
      # and its relative storeFile=upload-keystore.jks resolves against
      # android/app/, where the keystore is written here.
      - name: Restore release signing
        env:
          KS_B64: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_B64 }}
          KP_B64: ${{ secrets.ANDROID_KEY_PROPERTIES_B64 }}
        run: |
          set -euo pipefail
          test -n "$KS_B64" || { echo "ANDROID_UPLOAD_KEYSTORE_B64 secret is empty/missing" >&2; exit 1; }
          test -n "$KP_B64" || { echo "ANDROID_KEY_PROPERTIES_B64 secret is empty/missing" >&2; exit 1; }
          printf '%s' "$KS_B64" | base64 -d > android/app/upload-keystore.jks
          printf '%s' "$KP_B64" | base64 -d > android/key.properties
          # Fail fast with a readable message instead of Gradle's gate.
          test -s android/app/upload-keystore.jks || { echo "keystore decoded to an empty file" >&2; exit 1; }
          test -s android/key.properties || { echo "key.properties decoded to an empty file" >&2; exit 1; }
          echo "release signing restored: $(wc -c < android/app/upload-keystore.jks) byte keystore"

      - run: flutter build apk --release --no-pub

      - uses: actions/upload-artifact@v4
        with:
          name: apk-release
          path: dawai_app/build/app/outputs/flutter-apk/app-release.apk

  deploy-firebase:
    name: Deploy to Firebase App Distribution
    runs-on: ubuntu-latest
    needs: [flutter-build]
    if: (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master') && github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: apk-release
          path: apk/

      - uses: wzieba/Firebase-Distribution-Github-Action@v1
        with:
          appId: ${{ secrets.FIREBASE_APP_ID }}
          serviceCredentialsFileContent: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          file: apk/app-release.apk
          groups: testers

  web-build:
    name: Web - Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: project
    steps:
      - uses: actions/checkout@v4
      - run: echo "Web build skipped"
